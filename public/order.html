<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Finalização do Pedido - Bravus</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
  <div class="mobile-container">
    
    <div class="brand-header">
      <img src="/assets/banner.png" class="top-banner-img">
    </div>

    <div class="status-banner" id="status-banner">
      <img src="/assets/Nova pasta/08_status_aguardando_pagamento_transparent.png" alt="Status">
      <span>Aguardando Pagamento</span>
    </div>

    <div id="app-content"></div>

    <div class="support-footer" onclick="window.open('https://wa.me/5511927078767', '_blank')">
      <div class="support-left">
        <img src="/assets/Nova pasta/04_suporte_atendimento_transparent.png">
        <span>Precisa de ajuda? Fale com nossa equipe.</span>
      </div>
      <span class="arrow">›</span>
    </div>

    <div class="modal-overlay" id="modal-alter">
      <div class="modal-box">
        <h3>Atenção</h3>
        <p>Você está prestes a alterar a quantidade. Deseja prosseguir?</p>
        <div class="modal-btns">
          <button class="btn-cancel" onclick="close_alter_modal()">Cancelar</button>
          <button class="btn-ok" onclick="confirm_alter()">Sim, alterar</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const id = window.location.hash ? window.location.hash.replace('#', '') : window.location.pathname.split('/').pop();
    let orderData = null;
    let selection = {}; 
    let hatQty = 0;
    let pendingChange = null; 
    let modalShown = false; 

    async function init() {
      if (!id) return;
      try {
        const res = await fetch('/api/orders/' + id);
        if (!res.ok) throw new Error('Pedido não encontrado');
        
        const { order } = await res.json();
        orderData = order;
        
        if (order.status === 'paid') {
          document.getElementById('app-content').innerHTML = `
            <div class="card" style="text-align:center; padding: 40px 20px;">
              <h2 class="yellow-text">Pagamento Confirmado!</h2>
              <p style="color:#aaa; margin-top:10px;">Seu pedido já está em produção.</p>
            </div>`;
          document.getElementById('status-banner').style.display = 'none';
          document.querySelector('.support-footer').style.display = 'none';
        } else if (order.status === 'pending') {
          show_payment_screen(order);
        } else {
          build_customization_ui(order);
        }
      } catch (err) {
        document.getElementById('app-content').innerHTML = `<h1 style="color:white;text-align:center;margin-top:50px;">${err.message}</h1>`;
      }
    }

    function build_customization_ui(order) {
      document.getElementById('status-banner').style.display = 'none'; 

      hatQty = order.initial_hat_qty || 0;

      let carousel_html = '';
      let img_count = 0;
      if (order.photo_path) { carousel_html += `<div class="carousel-slide"><img src="${order.photo_path}" draggable="false"></div>`; img_count++; }
      if (order.hat_photo_path) { carousel_html += `<div class="carousel-slide"><img src="${order.hat_photo_path}" draggable="false"></div>`; img_count++; }

      let html = `
        <div class="carousel-container" style="display:${img_count > 0 ? 'block' : 'none'}">
          <div class="carousel-track" id="carousel">${carousel_html}</div>
          <div id="carousel-hint" style="display:${img_count > 1 ? 'block' : 'none'}; text-align:center; font-size:11px; color:#facc15; padding:5px; background:rgba(0,0,0,0.5);">← Deslize para o lado →</div>
        </div>

        <h1 class="title-main">Confira seu <span class="yellow-text">Pedido</span></h1>
        <p class="subtitle">Ajuste os tamanhos se necessário.</p>

        <div id="categories-wrapper"></div>
        <div id="hat-wrapper" style="display: none;"></div>

        <div class="summary-box">
          <div class="summary-left">
            <div class="icon-box"><img src="/assets/Nova pasta/01_selo_seguranca_transparent.png"></div>
            <div>
              <strong>${order.product_name}</strong>
              <span>${order.product_description}</span>
            </div>
          </div>
          <div class="summary-right">
            <span>Quantidade total</span>
            <strong class="yellow-text" id="total-qty">0</strong>
            <span style="margin-top:5px;">Valor Total</span>
            <strong class="yellow-text" id="total-price" style="font-size:18px;">R$ 0,00</strong>
          </div>
        </div>

        <button class="btn-confirm" id="btn-confirm" onclick="open_confirm_modal()" disabled>CONFIRMAR E PAGAR</button>
        <p class="secure-text">🔒 Você poderá revisar antes do pagamento.</p>
      `;

      document.getElementById('app-content').innerHTML = html;

      const catWrap = document.getElementById('categories-wrapper');
      order.available_categories.forEach(cat => {
        selection[cat.name] = cat.initial_sizes ? { ...cat.initial_sizes } : { PP:0, P:0, M:0, G:0, GG:0, XG:0 };
        
        const catDiv = document.createElement('div');
        catDiv.className = 'category-block';
        catDiv.innerHTML = `<h2 class="cat-title">${cat.name}</h2><div class="sizes-grid" id="grid-${cat.name.replace(/\s/g,'')}"></div>`;
        catWrap.appendChild(catDiv);
        
        const grid = catDiv.querySelector('.sizes-grid');
        ['PP', 'P', 'M', 'G', 'GG', 'XG'].forEach(size => {
          const qty = selection[cat.name][size] || 0;
          const item = document.createElement('div');
          item.className = qty > 0 ? 'size-item active' : 'size-item';
          item.id = `item-${cat.name.replace(/\s/g,'')}-${size}`;
          item.innerHTML = `
            <span class="size-label">${size}</span>
            <div class="counter">
              <button onclick="attempt_change('${cat.name}', '${size}', -1)">−</button>
              <span id="val-${cat.name.replace(/\s/g,'')}-${size}">${qty}</span>
              <button onclick="attempt_change('${cat.name}', '${size}', 1)">+</button>
            </div>
          `;
          grid.appendChild(item);
        });
      });

      if (order.has_hat) {
        document.getElementById('hat-wrapper').style.display = 'block';
        document.getElementById('hat-wrapper').innerHTML = `
          <div class="category-block">
            <h2 class="cat-title">Boné Personalizado</h2>
            <div class="size-item ${hatQty > 0 ? 'active' : ''}" id="hat-item" style="width: 100%;">
              <span class="size-label" style="font-size: 14px;">Boné <br><small style="color:#facc15;">R$ ${(order.hat_price_cents/100).toFixed(2).replace('.', ',')} cada</small></span>
              <div class="counter">
                <button onclick="change_hat(-1)">−</button><span id="val-hat">${hatQty}</span><button onclick="change_hat(1)">+</button>
              </div>
            </div>
          </div>
        `;
      }

      if (img_count > 1) enable_drag_scroll(document.getElementById('carousel'));
      update_total();
    }

    function show_payment_screen(order) {
      document.getElementById('status-banner').style.display = 'flex'; 
      const total = (order.total_cents / 100).toFixed(2).replace('.', ',');
      const qr_url = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(order.payment_link)}`;
      
      let items_html = '';
      if(order.selected_sizes) {
        order.selected_sizes.forEach(s => {
          let qtds = Object.entries(s.sizes).filter(([_, q]) => q > 0).map(([sz, q]) => `${q} un ${sz}`).join(', ');
          if (qtds) items_html += `<div class="order-item-line"><span>${s.category}</span><span class="yellow-text">${qtds}</span></div>`;
        });
      }
      if (order.hat_quantity > 0) items_html += `<div class="order-item-line"><span>Boné Personalizado</span><span class="yellow-text">${order.hat_quantity} un</span></div>`;

      const html = `
        <div class="card payment-card">
          
          <div class="card-header-line">
            <h2 style="font-size: 18px; margin:0; color:#fff;">Resumo do Pedido</h2>
            <span style="font-size: 12px; color: #888;">Pedido #${order.id}</span>
          </div>

          <div class="product-row">
            <div class="product-img">
              ${order.photo_path ? `<img src="${order.photo_path}">` : '<div style="background:#222; width:100%; height:100%;"></div>'}
            </div>
            <div class="product-info">
              <h3 style="font-size: 15px; margin-bottom: 5px; color:#fff;">${order.product_name}</h3>
              <div class="order-items-container">
                ${items_html}
              </div>
            </div>
          </div>

          <div class="total-line">
            <span>Total do Pedido</span>
            <h2 class="yellow-text" style="font-size: 22px; margin:0;">R$ ${total}</h2>
          </div>

          <hr class="divider">

          <div class="pix-container">
            <div class="pix-top">
              <div style="display:flex; align-items:center; gap:10px;">
                <img src="/assets/Nova pasta/01_selo_seguranca_transparent.png" style="width: 35px;">
                <div>
                  <h3 style="font-size: 16px; margin:0; color:#fff;">Pagamento via PIX</h3>
                  <p style="font-size: 11px; color: #888; margin:0;">Rápido, seguro e sem taxas.</p>
                </div>
              </div>
            </div>

            <div class="pix-content">
              <div class="qr-box">
                <img src="${qr_url}" alt="QR Code">
              </div>
              <div class="pix-instructions">
                <p style="font-size: 13px; color: #ddd; line-height: 1.4; margin-bottom: 15px;">
                  Escaneie o QR Code com o app do seu banco ou copie o código PIX abaixo.
                </p>
                <div class="input-copy">
                  <input type="text" id="pix-code" value="${order.payment_link}" readonly>
                  <button onclick="copy_pix()">Copiar</button>
                </div>
              </div>
            </div>

            <button class="btn-copy-large" onclick="copy_pix()">COPIAR CÓDIGO PIX</button>
          </div>

          <div class="trust-badges-row">
            <div class="trust-badge"><img src="/assets/Nova pasta/01_selo_seguranca_transparent.png"><span>Compra<br>Segura</span></div>
            <div class="trust-badge"><img src="/assets/Nova pasta/02_pagamento_rapido_transparent.png"><span>Pagamento<br>Rápido</span></div>
            <div class="trust-badge"><img src="/assets/Nova pasta/03_caixa_envio_transparent.png"><span>Produção<br>Ágil</span></div>
            <div class="trust-badge"><img src="/assets/Nova pasta/04_suporte_atendimento_transparent.png"><span>Suporte<br>Especializado</span></div>
          </div>

          <div class="timeline-container">
            <h4 style="font-size: 14px; margin-bottom: 20px; color:#fff;">Próximas Etapas</h4>
            <div class="timeline-track">
              <div class="timeline-line"></div>
              <div class="timeline-step">
                <div class="timeline-icon active"><img src="/assets/Nova pasta/05_etapa_pagamento_transparent.png"></div>
                <span>Pagamento<br>Confirmado</span>
              </div>
              <div class="timeline-step">
                <div class="timeline-icon"><img src="/assets/Nova pasta/06_etapa_producao_transparent.png"></div>
                <span>Produção<br>(até 1 dia útil)</span>
              </div>
              <div class="timeline-step">
                <div class="timeline-icon"><img src="/assets/Nova pasta/07_etapa_entrega_transparent.png"></div>
                <span>Envio<br>(rastreio)</span>
              </div>
            </div>
          </div>

        </div>
      `;

      document.getElementById('app-content').innerHTML = html;
    }

    function copy_pix() {
      const txt = document.getElementById('pix-code');
      txt.select();
      document.execCommand('copy');
      alert('Código PIX copiado com sucesso!');
    }

    function enable_drag_scroll(slider) {
      let isDown = false; let startX; let scrollLeft;
      slider.addEventListener('mousedown', (e) => { isDown = true; slider.style.cursor = 'grabbing'; startX = e.pageX - slider.offsetLeft; scrollLeft = slider.scrollLeft; });
      slider.addEventListener('mouseleave', () => { isDown = false; slider.style.cursor = 'grab'; });
      slider.addEventListener('mouseup', () => { isDown = false; slider.style.cursor = 'grab'; });
      slider.addEventListener('mousemove', (e) => {
        if (!isDown) return; e.preventDefault(); 
        const x = e.pageX - slider.offsetLeft; const walk = (x - startX) * 2; slider.scrollLeft = scrollLeft - walk;
      });
    }

    function attempt_change(cat, size, delta) {
      if (delta < 0 && selection[cat][size] === 0) return; 
      if (!modalShown) {
        pendingChange = { cat, size, delta };
        document.getElementById('modal-alter').style.display = 'flex';
      } else {
        apply_change(cat, size, delta);
      }
    }

    function confirm_alter() {
      if (pendingChange) apply_change(pendingChange.cat, pendingChange.size, pendingChange.delta);
      modalShown = true; close_alter_modal();
    }

    function close_alter_modal() {
      document.getElementById('modal-alter').style.display = 'none';
      pendingChange = null;
    }

    function apply_change(cat, size, delta) {
      selection[cat][size] += delta;
      document.getElementById(`val-${cat.replace(/\s/g,'')}-${size}`).textContent = selection[cat][size];
      const parent = document.getElementById(`item-${cat.replace(/\s/g,'')}-${size}`);
      if (selection[cat][size] > 0) parent.classList.add('active'); else parent.classList.remove('active');
      update_total();
    }

    function change_hat(delta) {
      if (delta < 0 && hatQty === 0) return;
      hatQty += delta;
      document.getElementById('val-hat').textContent = hatQty;
      const parent = document.getElementById('hat-item');
      if (hatQty > 0) parent.classList.add('active'); else parent.classList.remove('active');
      update_total();
    }

    function update_total() {
      let totalQty = hatQty;
      let totalPriceCents = 0;
      for (const cat in selection) {
        const catInfo = orderData.available_categories.find(c => c.name === cat);
        const catPrice = catInfo ? catInfo.price_cents : 0;
        for (const size in selection[cat]) {
          const qty = selection[cat][size];
          totalQty += qty;
          totalPriceCents += (catPrice * qty);
        }
      }
      if (orderData.has_hat && hatQty > 0) totalPriceCents += (orderData.hat_price_cents * hatQty);
      
      document.getElementById('total-qty').textContent = totalQty;
      document.getElementById('total-price').textContent = `R$ ${(totalPriceCents / 100).toFixed(2).replace('.', ',')}`;
      
      const btn = document.getElementById('btn-confirm');
      if (totalQty > 0) { btn.disabled = false; btn.style.opacity = '1'; } else { btn.disabled = true; btn.style.opacity = '0.5'; }
    }

    async function open_confirm_modal() {
      const btn = document.getElementById('btn-confirm');
      btn.textContent = 'GERANDO PIX...';
      btn.disabled = true;

      const payload = {
        selected_sizes: Object.keys(selection).map(cat => ({ category: cat, sizes: selection[cat] })),
        hat_quantity: hatQty
      };

      try {
        const res = await fetch(`/api/orders/${id}/checkout`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          location.reload(); 
        } else {
          const errJson = await res.json().catch(() => ({}));
          alert('Erro ao gerar pagamento: ' + (errJson.error || 'Verifique o painel.'));
          btn.textContent = 'CONFIRMAR E PAGAR';
          btn.disabled = false;
        }
      } catch (err) {
        alert('Erro de conexão.');
        btn.textContent = 'CONFIRMAR E PAGAR';
        btn.disabled = false;
      }
    }

    init();
  </script>
</body>
</html>
