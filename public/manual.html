<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagamento Manual - Admin</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="admin-body">
  <header class="admin-header">
    <div class="header-content">
      <h1>Pagamento <span class="yellow-text">Manual</span></h1>
      <a href="/admin.html" style="color: #aaa; text-decoration: none; font-size: 14px;">&larr; Voltar para o Painel</a>
    </div>
  </header>

  <main class="admin-main" style="max-width: 600px;">
    <section class="card">
      <div class="card-header">
        <h2>Criar Pedido Manual</h2>
        <p>Gere o PIX no seu banco e insira os dados abaixo.</p>
      </div>

      <form id="manual-form" enctype="multipart/form-data">
        <label class="input-group">Nome do Cliente
          <input name="client_name" placeholder="Ex: João Silva" required>
        </label>
        
        <label class="input-group">E-mail (Opcional)
          <input name="client_email" type="email" placeholder="joao@email.com">
        </label>

        <label class="input-group">Valor Total (R$)
          <input name="amount_reais" type="number" step="0.01" placeholder="Ex: 150.00" required>
        </label>

        <label class="input-group">PIX Copia e Cola
          <textarea name="pix_code" rows="3" placeholder="Cole aqui o código PIX gerado no seu banco" required style="background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 8px; font-family: inherit; font-size: 14px; resize: vertical;"></textarea>
        </label>

        <label class="input-group">Foto do QR Code (Print do seu banco)
          <input type="file" name="qr_image" accept="image/*" required>
        </label>

        <button type="submit" class="btn-primary" style="margin-top: 20px;">Gerar Link de Pagamento (10 min)</button>
      </form>
      
      <p id="result" style="margin-top: 15px; font-size: 14px; word-break: break-all;"></p>
    </section>
  </main>

  <script>
    document.getElementById('manual-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.textContent = 'Gerando...';
      btn.disabled = true;

      const data = new FormData(e.target);
      
      try {
        const res = await fetch('/api/admin/manual-orders', { method: 'POST', body: data });
        const json = await res.json();
        
        const out = document.getElementById('result');
        if (res.ok) {
          const link = `${window.location.origin}/pagamentomanual#${json.order.id}`;
          out.innerHTML = `✅ Pedido criado! <br><br> <strong>Link do cliente:</strong><br> <a href="${link}" target="_blank" style="color: #facc15;">${link}</a>`;
          out.style.color = '#22c55e';
          e.target.reset();
        } else {
          out.textContent = '❌ Erro: ' + json.error;
          out.style.color = '#ef4444';
        }
      } catch (err) {
        document.getElementById('result').textContent = '❌ Erro de conexão.';
        document.getElementById('result').style.color = '#ef4444';
      }
      
      btn.textContent = 'Gerar Link de Pagamento (10 min)';
      btn.disabled = false;
    });
  </script>
</body>
</html>
